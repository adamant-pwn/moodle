issueNumber: MDL-89559
notes:
  filter_mathjaxloader:
    - message: >-
        The loader AMD module provides typesetWithConfig(container, config) for
        trusted installed plugins to register scoped TeX configuration on a DOM
        root before its first typesetting. This requires MathJax 4 and accepts
        built-in package names and JSON TeX options, subject to administrator
        configuration. Plugins must retain the renderer-created element reference
        and must not derive authorization or configuration from user markup.
        Options such as texhtml do not sanitize HTML: callers remain responsible
        for trusted or appropriately cleaned content. See the component README
        for registration ordering, isolation limits and failure handling.
      type: improved
